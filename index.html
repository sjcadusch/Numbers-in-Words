<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Random Number in Words</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; max-width: 720px; }
    .row { display: flex; gap: 1rem; margin-bottom: 1rem; flex-wrap: wrap; }
    label { display: flex; flex-direction: column; gap: 0.25rem; }
    input { padding: 0.5rem; width: 180px; }
    button { padding: 0.6rem 1rem; cursor: pointer; }
    #result { margin-top: 1rem; font-size: 1.2rem; font-weight: bold; }
    #error { color: #b00020; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>Random Number in Words</h1>
  <p>Generate a random number from 0 to 10,000 and display it in words only.</p>

  <div class="row">
    <label>
      Minimum
      <input id="min" type="number" min="0" max="10000" value="0" />
    </label>
    <label>
      Maximum
      <input id="max" type="number" min="0" max="10000" value="10000" />
    </label>
  </div>

  <button id="generate">Generate</button>
  <div id="error"></div>
  <div id="result"></div>

  <script>
    function numberToWords(number) {
      if (number < 0 || number > 10000 || !Number.isInteger(number)) {
        throw new Error('Number must be an integer between 0 and 10,000.');
      }

      const ones = [
        'zero', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine',
        'ten', 'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen',
        'eighteen', 'nineteen'
      ];
      const tens = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];

      if (number < 20) return ones[number];

      if (number < 100) {
        const ten = Math.floor(number / 10);
        const remainder = number % 10;
        return remainder === 0 ? tens[ten] : `${tens[ten]}-${ones[remainder]}`;
      }

      if (number < 1000) {
        const hundred = Math.floor(number / 100);
        const remainder = number % 100;
        return remainder === 0
          ? `${ones[hundred]} hundred`
          : `${ones[hundred]} hundred and ${numberToWords(remainder)}`;
      }

      if (number < 10000) {
        const thousand = Math.floor(number / 1000);
        const remainder = number % 1000;
        if (remainder === 0) return `${ones[thousand]} thousand`;
        const joiner = remainder < 100 ? ' and ' : ' ';
        return `${ones[thousand]} thousand${joiner}${numberToWords(remainder)}`;
      }

      return 'ten thousand';
    }

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateWords() {
      const minInput = document.getElementById('min');
      const maxInput = document.getElementById('max');
      const result = document.getElementById('result');
      const error = document.getElementById('error');

      error.textContent = '';
      result.textContent = '';

      const min = Number(minInput.value);
      const max = Number(maxInput.value);

      if (!Number.isInteger(min) || !Number.isInteger(max)) {
        error.textContent = 'Please enter whole numbers for minimum and maximum.';
        return;
      }
      if (min < 0 || max > 10000) {
        error.textContent = 'Range must stay within 0 to 10,000.';
        return;
      }
      if (min > max) {
        error.textContent = 'Minimum must be less than or equal to maximum.';
        return;
      }

      const value = randomInt(min, max);
      result.textContent = numberToWords(value);
    }

    document.getElementById('generate').addEventListener('click', generateWords);
  </script>
</body>
</html>
